# TIDES with risk-guided adaptive sub-stepping (Table 1, "TIDES (adaptive)").
# background: taken from the fitted 4DGS scene (white by default). Set it here only to override.
queries_per_frame: 10
adaptive: true
max_sub: 8
slope: analytic
mask_mixed: true
render:
  tile: 16
  tau_max: 0.99
  log_eps: 0.001
comparator:
  C_pos: 0.2
  C_neg: 0.2
  sigma_C: 0.03
  n_max: 8
  local_model: quadratic
risk:
  b_min: 0.05
arbiter:
  enabled: true
